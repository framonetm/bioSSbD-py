      Process stability: {value: 5, evidence: literature, source: Table 6}
      Inhibition risk (favourability): {value: 4, evidence: literature, source: Table 6}
      Operational complexity (favourability): {value: 4, evidence: literature, source: Table 6}
      Start-up risk (favourability): {value: 3, evidence: literature, source: Table 6}
